<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Daily Cash Collection Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Daily Cash Collection…<div class="bb-sub">Supabase user + location permissions</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v4.7.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Daily Cash source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-daily-cash-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Daily Cash source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='(async function init(){';
    const replacement=`api=window.BBDailyCashAdapter.api;\napiPost=window.BBDailyCashAdapter.apiPost;\nloadLocationMap=async function(){\n  const map=await window.BBDailyCashAdapter.locationMap();\n  locationMap=map;\n  return map;\n};\nsalesmanSessionToken='SUPABASE_AUTH';\n\n(async function init(){\n  try{\n    await window.BBDailyCashAdapter.ensureSession();\n    const profile=await window.BBDailyCashAdapter.accessProfile();\n    const label=profile?.staff?.staffName||profile?.user?.email||'Signed in';\n    const pill=document.querySelector('.topbar .pill');\n    if(pill)pill.textContent='Supabase · '+label;\n  }catch(error){\n    showError(error?.message||'Daily Cash Collection access denied.');\n    if($("syncStatus"))$("syncStatus").textContent='Supabase sign-in required';\n    return;\n  }`;
    if(!html.includes(marker))throw new Error('Daily Cash initialization marker was not found.');
    html=html.replace(marker,replacement);
    html=html.replace('<title>BIG BROTHER — Daily Cash Collection V4.4 Responsive Close Workspace</title>','<title>BIG BROTHER — Daily Cash Collection Supabase</title>');
    html=html.replace('Invoice History · Cash Sales Only','Supabase · Cash Sales Only');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Daily Cash Collection<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
