<!doctype html>
<html lang="en">
<head>

<title>BIG BROTHER — Your Collection Mobile</title>
<style>

<body>
<div id="boot">Loading Your Collection…</div>
<iframe id="collectionFrame" src="your-collection.html?embed=1&mobileSkin=1&v=20260914-2" title="Your Collection"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('collectionFrame');
const boot=document.getElementById('boot');
const MOBILE_CSS=`
:root{--bb-blue:#1768d5;--bb-navy:#123f78;--bb-bg:#f4f7fb;--bb-line:#dfe7f0;--bb-text:#18324e;--bb-muted:#6d7e92;--bb-red:#d73545;--bb-green:#159a5b;--bb-amber:#b57500}
html,body{background:var(--bb-bg)!important;overflow-x:hidden!important}
body{padding:7px 8px 20px!important;font-family:Arial,Helvetica,sans-serif!important}
.wrap{max-width:none!important;margin:0!important}
.topbar{display:none!important}
.statusbar{margin-bottom:8px!important;padding:8px 10px!important;font-size:10px!important}
.cards{grid-template-columns:1fr 1fr!important;gap:7px!important;margin-bottom:8px!important}
.card{position:relative!important;min-height:74px!important;padding:10px 10px 9px 43px!important;border-radius:12px!important;box-shadow:none!important;overflow:hidden!important}
.card::before{position:absolute;left:10px;top:12px;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.card:nth-child(1){background:#f3f8ff!important;border-color:#d5e6ff!important}.card:nth-child(1)::before{content:'🧾';background:#e2efff}
.card:nth-child(2){background:#f1fbf6!important;border-color:#cfead9!important}.card:nth-child(2)::before{content:'$';background:#d9f3e4;color:#13874e}
.card:nth-child(3){background:#fff8ef!important;border-color:#f3dec0!important}.card:nth-child(3)::before{content:'៛';background:#ffead0;color:#a45d00}
.card:nth-child(4){background:#f3f8ff!important;border-color:#d5e6ff!important}.card:nth-child(4)::before{content:'▥';background:#e2efff;color:#1768d5}
.card small{font-size:9px!important;margin:0 0 4px!important;line-height:1.1!important}.card strong{font-size:16px!important;line-height:1.15!important;white-space:normal!important}
.panel{border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
.filters{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;padding:9px!important;margin-bottom:8px!important;border:1px solid var(--bb-line)!important;border-radius:12px!important;background:#fff!important}
.bb-mobile-filter-field{min-width:0}.bb-mobile-filter-field label{display:block;margin:0 0 4px;font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.2px;color:#526b84}
.filters input,.filters select,.filters .btn{min-width:0!important;width:100%!important;min-height:40px!important;height:40px!important;border-radius:9px!important;padding:7px 9px!important;font-size:12px!important}
#dateTo{display:none!important}.bb-date-to-wrap{display:none!important}
.bb-filter-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;grid-column:1/-1!important}.bb-filter-actions .btn{font-size:10px!important;padding:6px!important}
.summary-toolbar{padding:0 9px 8px!important;margin-top:-1px!important}.summary-toolbar .btn{width:100%!important;min-height:40px!important;border-radius:9px!important;font-size:11px!important}
.requestbar{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:9px!important;margin:0 0 8px!important;border-radius:12px!important;background:#eef6ff!important;box-shadow:none!important}
.requestbar .sum{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;width:100%!important}.requestbar .sum span{padding:7px 8px!important;border:1px solid #d9e6f7!important;border-radius:9px!important;background:#fff!important;font-size:8.5px!important;line-height:1.2!important}.requestbar .sum strong{font-size:14px!important;margin-top:3px!important;white-space:nowrap!important}
.requestbar>.btn{width:100%!important;min-height:40px!important;font-size:10px!important}.requestbar>.btn.secondary{grid-column:1!important}.requestbar>.btn.request{grid-column:1!important}
.tablewrap{overflow:visible!important}
#summaryBody{display:grid!important;gap:8px!important;padding:0!important}
#summaryBody>tr{display:grid!important;grid-template-columns:24px minmax(86px,104px) minmax(0,1fr) auto!important;grid-template-areas:'check inv customer status' '. date location action' '. usd khr total'!important;column-gap:7px!important;row-gap:6px!important;align-items:center!important;padding:9px!important;border:1px solid var(--bb-line)!important;border-radius:13px!important;background:#fff!important;box-shadow:0 2px 8px rgba(23,63,119,.045)!important;overflow:hidden!important}
#summaryBody>tr>td{display:block!important;min-width:0!important;border:0!important;padding:0!important;background:transparent!important;font-size:10px!important;line-height:1.2!important;white-space:normal!important}
#summaryBody>tr>td:nth-child(1){grid-area:check!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}
#summaryBody .select-box{width:18px!important;height:18px!important;margin:0!important}
#summaryBody>tr>td:nth-child(2){grid-area:date!important;color:#60758c!important;font-size:9px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#summaryBody>tr>td:nth-child(2)::before{content:'Date: ';font-weight:900;color:#50677f}
#summaryBody>tr>td:nth-child(3){grid-area:inv!important;font-size:13px!important;font-weight:900!important;color:var(--bb-navy)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#summaryBody>tr>td:nth-child(4){display:none!important}
#summaryBody>tr>td:nth-child(5){grid-area:location!important;font-size:9px!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#summaryBody>tr>td:nth-child(5)::before{content:'📍 ';font-size:8px}
#summaryBody>tr>td:nth-child(6){grid-area:customer!important;font-size:13px!important;font-weight:900!important;color:var(--bb-navy)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#summaryBody>tr>td:nth-child(7){grid-area:usd!important}
#summaryBody>tr>td:nth-child(8){grid-area:khr!important}
#summaryBody>tr>td:nth-child(9){display:none!important}
#summaryBody>tr>td:nth-child(10){grid-area:total!important}
#summaryBody>tr>td:nth-child(7),#summaryBody>tr>td:nth-child(8),#summaryBody>tr>td:nth-child(10){padding:6px 7px!important;border-radius:8px!important;background:#f7f9fc!important;font-size:10.5px!important;font-weight:900!important;text-align:left!important;overflow:hidden!important}
#summaryBody>tr>td:nth-child(7)::before{content:'Cash USD';display:block;font-size:7px;color:var(--bb-muted);font-weight:700;margin-bottom:2px}
#summaryBody>tr>td:nth-child(8)::before{content:'Cash KHR';display:block;font-size:7px;color:var(--bb-muted);font-weight:700;margin-bottom:2px}
#summaryBody>tr>td:nth-child(10)::before{content:'Total USD';display:block;font-size:7px;color:var(--bb-muted);font-weight:700;margin-bottom:2px}
#summaryBody>tr>td:nth-child(11){grid-area:status!important;justify-self:end!important;align-self:center!important}.status-pill{font-size:8px!important;padding:4px 7px!important;white-space:nowrap!important}
#summaryBody>tr>td:nth-child(12){grid-area:action!important;justify-self:end!important;min-width:0!important}.main-table-actions{display:flex!important;gap:4px!important;justify-content:flex-end!important}.main-table-actions .btn{min-height:34px!important;padding:5px 7px!important;border-radius:8px!important;font-size:8px!important;white-space:nowrap!important}.main-table-actions .btn.request{background:var(--bb-green)!important}
#summaryBody>tr.bb-empty-row{display:block!important;padding:20px 10px!important}.bb-empty-row .empty{display:block!important;text-align:center!important;color:var(--bb-muted)!important}
#summaryBody~*{min-width:0!important}
#summaryBody+*{min-width:0!important}
#summaryBody.parent{}
.panel>.tablewrap>table{display:block!important;width:100%!important;min-width:0!important;border-collapse:separate!important}.panel>.tablewrap>table>thead{display:none!important}.panel>.tablewrap>table>tbody{width:100%!important}
.paginationbar,.foot{padding:8px 2px!important;font-size:9px!important;gap:6px!important}.page-btn{min-width:30px!important;height:30px!important;padding:0 7px!important;font-size:10px!important}
.note{display:none!important}
.overlay{padding:0!important;align-items:flex-end!important}.modal,.summary-modal{width:100%!important;max-width:none!important;max-height:94vh!important;border-radius:18px 18px 0 0!important;padding:11px!important}.modal-actions{gap:7px!important}.modal-title h2{font-size:17px!important}.preview-meta{grid-template-columns:1fr 1fr!important;gap:7px!important}.meta-box{padding:8px!important}.meta-box small{font-size:8px!important}.meta-box strong{font-size:11px!important}.detail-card{padding:10px!important;border-radius:11px!important}.close-workspace{width:100%!important;height:94vh!important;border-radius:18px 18px 0 0!important;grid-template-columns:1fr!important;overflow:auto!important}.close-left{min-height:430px!important;border-right:0!important;border-bottom:1px solid var(--bb-line)!important}.close-right{padding:12px!important}.close-head{padding:12px!important}.close-head h2{font-size:18px!important}.rulebar{margin:8px!important;font-size:10px!important}.close-metrics{gap:7px!important}.close-metric{padding:8px!important}.close-metric strong{font-size:14px!important}
@media(max-width:380px){body{padding:6px 6px 18px!important}.cards{gap:6px!important}.card{padding:9px 8px 8px 38px!important}.card::before{left:8px!important}.card strong{font-size:14px!important}.filters{gap:6px!important;padding:8px!important}#summaryBody>tr{grid-template-columns:22px minmax(78px,92px) minmax(0,1fr) auto!important;column-gap:5px!important;padding:8px 7px!important}#summaryBody>tr>td:nth-child(3),#summaryBody>tr>td:nth-child(6){font-size:12px!important}.main-table-actions .btn{padding:5px 6px!important;font-size:7.5px!important}}
`;

const MOBILE_SCRIPT=`(function(){
'use strict';
function clean(v){return String(v==null?'':v).trim()}
function wrapField(el,label,cls){if(!el||el.parentElement?.classList.contains('bb-mobile-filter-field'))return el?.parentElement;const w=document.createElement('div');w.className='bb-mobile-filter-field '+(cls||'');const l=document.createElement('label');l.textContent=label;el.parentNode.insertBefore(w,el);w.appendChild(l);w.appendChild(el);return w}
function ensureFilters(){const filters=document.querySelector('.filters');if(!filters)return false;const from=document.getElementById('dateFrom'),to=document.getElementById('dateTo'),loc=document.getElementById('locationFilter');if(!from||!to||!loc)return false;wrapField(from,'Collection Date','bb-date-from-wrap');wrapField(to,'Date To','bb-date-to-wrap');wrapField(loc,'Location','bb-location-wrap');let customer=document.getElementById('bbCustomerSearch');if(!customer){customer=document.createElement('input');customer.type='search';customer.id='bbCustomerSearch';customer.placeholder='Search customer...';customer.autocomplete='off';const w=document.createElement('div');w.className='bb-mobile-filter-field';w.innerHTML='<label>Customer Search</label>';w.appendChild(customer);filters.insertBefore(w,filters.querySelector('.btn'));}let status=document.getElementById('bbStatusFilter');if(!status){status=document.createElement('select');status.id='bbStatusFilter';status.innerHTML='<option value="">All Status</option>';const w=document.createElement('div');w.className='bb-mobile-filter-field';w.innerHTML='<label>Status</label>';w.appendChild(status);filters.insertBefore(w,filters.querySelector('.btn'));}let actions=filters.querySelector('.bb-filter-actions');if(!actions){actions=document.createElement('div');actions.className='bb-filter-actions';const buttons=[...filters.querySelectorAll(':scope > .btn')];filters.appendChild(actions);buttons.forEach(b=>actions.appendChild(b));}
customer.addEventListener('input',()=>{try{mainPage=1;applyFilters()}catch(_){}});status.addEventListener('change',()=>{try{mainPage=1;applyFilters()}catch(_){}});from.addEventListener('change',()=>{to.value=from.value;});return true}
function populateStatus(){const s=document.getElementById('bbStatusFilter');if(!s||typeof groups==='undefined'||typeof groupRequestStatus!=='function')return;const keep=s.value;const values=[...new Set(groups.map(g=>clean(groupRequestStatus(g))).filter(Boolean))].sort();s.innerHTML='<option value="">All Status</option>'+values.map(v=>'<option value="'+v.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+v.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');if(values.includes(keep))s.value=keep}
function installFilterOverride(){if(window.__bbCollectionFilterInstalled)return true;if(typeof groups==='undefined'||typeof renderGroups!=='function'||typeof groupRequestStatus!=='function'||typeof MAIN_PAGE_SIZE==='undefined')return false;window.__bbCollectionFilterInstalled=true;applyFilters=function(){const f=document.getElementById('dateFrom')?.value||'';const t=f;const l=document.getElementById('locationFilter')?.value||'';const q=clean(document.getElementById('bbCustomerSearch')?.value).toLowerCase();const st=clean(document.getElementById('bbStatusFilter')?.value).toLowerCase();filteredGroups=groups.filter(g=>{const customer=(g.invoices||[]).some(inv=>clean(inv.customer).toLowerCase().includes(q));return(!f||g.saleDate>=f)&&(!t||g.saleDate<=t)&&(!l||g.locationName===l)&&(!q||customer)&&(!st||clean(groupRequestStatus(g)).toLowerCase()===st)});const pageCount=Math.max(1,Math.ceil(filteredGroups.length/MAIN_PAGE_SIZE));if(mainPage>pageCount)mainPage=pageCount;if(mainPage<1)mainPage=1;renderGroups()};clearFilters=function(){const a=document.getElementById('dateFrom'),b=document.getElementById('dateTo'),l=document.getElementById('locationFilter'),q=document.getElementById('bbCustomerSearch'),s=document.getElementById('bbStatusFilter');if(a)a.value='';if(b)b.value='';if(l)l.value='';if(q)q.value='';if(s)s.value='';mainPage=1;applyFilters()};return true}
function polishRows(){const body=document.getElementById('summaryBody');if(!body)return;body.querySelectorAll(':scope > tr').forEach(tr=>{tr.classList.toggle('bb-empty-row',!!tr.querySelector('td.empty'));const cells=tr.children;if(cells.length<12)return;const primary=cells[11].querySelector('.btn.primary');if(primary)primary.textContent='View';const req=cells[11].querySelector('.btn.request');if(req&&!req.disabled)req.textContent='Close';});const spans=document.querySelectorAll('.requestbar .sum span');if(spans[0]&&spans[0].firstChild)spans[0].firstChild.nodeValue='Selected Groups';}
function observe(){const body=document.getElementById('summaryBody');if(body&&!body.__bbMobileObserved){body.__bbMobileObserved=true;new MutationObserver(()=>requestAnimationFrame(()=>{polishRows();populateStatus()})).observe(body,{childList:true,subtree:true});}}
function bootMobile(){if(!ensureFilters()){setTimeout(bootMobile,100);return}if(!installFilterOverride()){setTimeout(bootMobile,100);return}populateStatus();polishRows();observe();setTimeout(()=>{populateStatus();polishRows()},400)}
bootMobile();
})();`;

function inject(){let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}if(!doc||!doc.head)return;let style=doc.getElementById('bb-mobile-collection-skin');if(!style){style=doc.createElement('style');style.id='bb-mobile-collection-skin';doc.head.appendChild(style)}style.textContent=MOBILE_CSS;if(!doc.getElementById('bb-mobile-collection-script')){const script=doc.createElement('script');script.id='bb-mobile-collection-script';script.textContent=MOBILE_SCRIPT;doc.body.appendChild(script)}boot.classList.add('hide')}
frame.addEventListener('load',()=>{setTimeout(inject,80);setTimeout(inject,500);setTimeout(inject,1400)});
})();
</script>
</body>
</html>
